{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static "css/output.css" %}">
    <title>Sign in</title>
</head>
<body>
    <div class="h-screen flex flex-col items-center justify-center">
        <form method="POST" class="w-80 flex flex-col gap-4 p-10 border  rounded-md">
            <span class="font-bold text-2xl text-center">Login</span>
            {% csrf_token %}
            <input class="p-3 border rounded-md outline-none w-full" type="text" placeholder="Enter your username" name='username'>
            <input class="p-3 border rounded-md outline-none w-full" type="password" placeholder="Enter your password" name="password">
            <button class="bg-green-500 text-white p-3 w-full" type="submit">Login</button>
        </form>
    </div>
</body>
</html>
