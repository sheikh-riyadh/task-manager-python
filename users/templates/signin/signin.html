{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static "css/output.css" %}">
    <title>Sign in</title>
</head>
<body>
    <div class="h-screen flex flex-col items-center justify-center">
        {% if messages %}
            {% for message in messages %}
                <p>{{message}}</p>
            {% endfor %}
        {% endif %}
        <form method="POST" class="w-80 flex flex-col gap-4 p-10 border  rounded-md">
            <span class="font-bold text-2xl text-center">Login</span>
            {% csrf_token %}
            {{form.as_p}}
            <button class="bg-green-500 text-white p-3 w-full" type="submit">Login</button>
        </form>
    </div>
</body>
</html>
