<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static "css/output.css" %}">
    <title>Registration</title>
</head>
<body>

    <div class="h-screen flex flex-col items-center justify-center">
        <div class="w-2/4 shadow-lg border rounded-md p-10">
            {% if messages %}
                {% for message in messages %}
                    <p>{{message}}</p>
                {% endfor %}
            {% endif %}
            <form method="POST" class="h-full flex flex-col gap-2 justify-center">
                <span class="uppercase font-medium">Register</span>
                {% csrf_token %}
                {% for field in form %}
                    <label for="{{field.id_for_label}}">{{field.label}}</label>
                    {{field}}

                    {% if field.errors %}
                        <ul>
                            {% for error in field.errors %}
                                <li>{{error}}</li>
                            {% endfor %} 
                        </ul>
                    {% endif %}
                {% endfor %}
                <button class="border w-full uppercase font-medium py-1 rounded-md bg-blue-500 text-white" type="submit">Sign-up</button>
            </form>
        </div>
    </div>
</body>
</html>
